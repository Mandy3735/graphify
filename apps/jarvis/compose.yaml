services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${JARVIS_LOCAL_DB_PASSWORD:-jarvis-local-only}
      POSTGRES_DB: jarvis
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["jarvis-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  jarvis-db:
