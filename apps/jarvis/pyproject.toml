[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-graphify"
version = "0.2.0"
description = "Policy-controlled JARVIS with inspectable personal memory surrounding Graphify"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "openai>=1.60,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1",
       "aiosqlite>=0.20,<1", "ruff>=0.9,<1", "pyright>=1.1.390,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src"]
# Graphify uses a setuptools editable import hook that Pyright cannot follow.
# Resolve its source explicitly, relative to this configuration file.
extraPaths = ["../.."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "../.."
venv = ".venv"
